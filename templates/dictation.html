<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chép chính tả</title>
<style>
  :root { color-scheme:dark; --bg:#0d0f13; --card:rgba(10,11,15,.82); --fg:#e8eaee; --muted:#a4adbb; --line:rgba(255,255,255,.16); --accent:#6b8cff; --err:#ff6b5e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
  #bg { position:fixed; left:0; right:0; top:50%; height:400px; max-height:100vh; transform:translateY(-50%); z-index:-1; background:center / contain no-repeat; filter:blur(6px) brightness(.22); }
  main { min-height:100vh; width:100%; max-width:none; margin:0; padding:0; display:flex; flex-direction:column; }
  main > .card { flex:1; }
  .card { background:none; border:0; padding:0; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  input[type=url] { width:100%; font:inherit; padding:12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  input.time { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  input[type=url]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; margin:16px 0; }
  label { display:flex; flex-direction:column; gap:4px; font-size:.85rem; color:var(--muted); flex:1; min-width:140px; }
  select, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  progress { width:100%; height:10px; margin-top:16px; }
  #msg { margin:8px 0 0; color:var(--muted); min-height:1.5em; }
  #msg.err { color:var(--err); }
  #out { margin-top:20px; display:none; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; align-items:center; flex-wrap:wrap; }
  .tabs button.on { border-color:var(--accent); color:var(--accent); }
  .spacer { flex:1; }
  #check { margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
  #check h2 { font-size:1.05rem; margin:0 0 8px; }
  #first { position:fixed; left:50%; bottom:8vh; transform:translateX(-50%); width:min(960px, 92vw); text-align:left; white-space:nowrap; overflow:hidden; font-size:clamp(1.3rem, 2.6vw, 2rem); line-height:1.5; text-shadow:0 2px 8px rgba(0,0,0,.9); background:none; border:0; padding:0; margin:0; }
  #first .y { color:#ffd84d; }
  #first .bad { color:var(--err); }
  @keyframes blink { 50% { opacity:0; } }
  #firstText { display:inline-block; transition:transform .15s ease-out; }
  /* ô nhập nhỏ dưới dòng sub (bật bằng nút ⌨): thấy được chữ đang gõ, khung gợi ý của IME hiện ngay bên dưới */
  #typed.vis { opacity:1 !important; pointer-events:auto !important; left:50% !important; bottom:2.5vh !important; transform:translateX(-50%); width:min(420px, 80vw) !important; height:auto !important; padding:6px 10px !important; text-align:center; color:var(--fg); background:rgba(20,22,28,.9); border:1px solid var(--line) !important; border-radius:8px; outline:none; }
  #typed.vis:focus { border-color:var(--accent) !important; }
  #first .sep { white-space:pre; color:var(--muted); }
  #first .pv { color:#ffd84d; white-space:pre; }
  #first .nx { opacity:.4; white-space:pre; }
  #first .sp { white-space:pre; }
  #first .cw.sp { text-decoration-color:var(--err); }
  #first .cw { text-decoration:underline; text-decoration-color:#ffd84d; text-decoration-thickness:3px; text-underline-offset:6px; }
  #first small { color:var(--muted); display:block; }
  #segList { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.6); padding:16px; }
  #segList[hidden] { display:none; }
  #segList .box { width:min(720px, 100%); max-height:80vh; overflow-y:auto; background:#14161c; border:1px solid var(--line); border-radius:12px; }
  #segList .sg { display:flex; color:var(--fg); gap:10px; width:100%; text-align:left; border:0; border-top:1px solid var(--line); border-radius:0; background:transparent; padding:8px 10px; }
  #segList .sg { cursor:pointer; align-items:center; }
  #segList .sg .tx { flex:1; }
  #segList .sg .ed { flex:none; padding:2px 6px; background:transparent; border:0; opacity:.5; }
  #segList .sg .ed:hover { opacity:1; }
  #segList .sg .ei { flex:1; font:inherit; color:var(--fg); background:#0d0f13; border:1px solid var(--accent); border-radius:6px; padding:4px 6px; }
  #segList .sg:first-child { border-top:0; }
  #segList .sg:hover { background:rgba(255,255,255,.08); }
  #segList .sg.on { background:color-mix(in srgb, var(--accent) 15%, transparent); }
  #segList .sg small { color:var(--muted); flex:none; min-width:3em; }
  .item { display:flex; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .item .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item small { color:var(--muted); }
  textarea { width:100%; height:320px; resize:vertical; font:14px/1.5 ui-monospace, Consolas, monospace;
             background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; }
  a { color:var(--accent); }
  #back { font-size:1.4rem; text-decoration:none; margin-right:8px; }
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <p class="sub"><a href="./" id="back" title="Về trang chủ" aria-label="Về trang chủ">←</a> <span id="title"></span></p>
  <div class="card">
    <p id="msg" style="margin:0"></p>
    <audio id="aud" preload="auto" hidden></audio>
  <div id="check" style="margin:0;padding:0;border:0">
    <div style="display:flex;align-items:center;gap:8px;margin:0 0 8px">
      <span id="pos" style="color:var(--muted)"></span>
      <button id="pickSeg" type="button" title="Chọn câu" aria-label="Chọn câu" style="padding:2px 8px">📜</button>
      <button id="reveal" type="button" title="Hiện / ẩn sub" aria-label="Hiện / ẩn sub" style="padding:2px 8px">👁</button>
      <button id="showInput" type="button" title="Hiện / ẩn ô nhập" aria-label="Hiện / ẩn ô nhập" style="padding:2px 8px">⌨</button>
    </div>
    <div id="segList" hidden></div>
    <input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gõ câu bạn nghe được" style="position:fixed;left:0;bottom:0;width:1px;height:1.5em;font-size:16px;opacity:0;border:0;padding:0;pointer-events:none">
    <div id="first"><span id="firstText"></span></div>
    <div class="tabs"><small id="playNote" style="color:var(--muted)"></small></div>
    <div id="ytbox" style="position:absolute;left:-9999px;width:200px;height:200px"><div id="yt"></div></div>
  </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let videoId = null, player = null, apiReady = null;
let isFile = false, live = false, segs = [], cur = 0, revealed = false, started = false;
const jobId = new URLSearchParams(location.search).get('id');
function parseVideoId(u) {
  try {
    const x = new URL(u);
    if (x.hostname === 'youtu.be') return x.pathname.slice(1).split('/')[0];
    const m = x.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/);
    return x.searchParams.get('v') || (m && m[1]) || null;
  } catch { return null; }
}
function loadApi() {
  if (apiReady) return apiReady;
  return apiReady = new Promise((res, rej) => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = rej;
    document.head.appendChild(s);
  });
}
// Trình duyệt có thể chặn tự phát khi vừa mở trang; khi đó phát câu hiện tại ngay ở lần bấm phím/chuột đầu tiên.
let blocked = false;
['keydown', 'pointerdown'].forEach(ev => document.addEventListener(ev, () => {
  if (blocked) { blocked = false; playCurrent(); }
}, true));
function playLocal(g) {
  const a = $('aud');
  const src = `api/jobs/${jobId}/audio`;
  if (!a.src.endsWith(src)) a.src = src;
  const stopAt = g.end + 0.3;
  a.ontimeupdate = () => { if (a.currentTime >= stopAt) { a.pause(); a.ontimeupdate = null; } };
  const go = () => { a.currentTime = Math.max(0, g.start); a.play().catch(() => { blocked = true; }); };
  a.readyState >= 1 ? go() : a.addEventListener('loadedmetadata', go, { once: true });
}
async function playCurrent() {
  if (!segs[cur]) return;
  if (isFile) return playLocal(segs[cur]);
  if (!videoId) return;
  const firstSeg = segs[cur];
  $('playNote').textContent = ' Đang tải...';
  try {
    await loadApi();
    const arg = { videoId, startSeconds: Math.max(0, firstSeg.start), endSeconds: firstSeg.end + 0.3 };
    if (!player) {
      player = new YT.Player('yt', { height: '200', width: '200', playerVars: { playsinline: 1 },
        events: { onAutoplayBlocked: () => { blocked = true; }, onReady: () => { player.loadVideoById(arg); $('playNote').textContent = ''; },
                  onError: () => $('playNote').textContent = ' Video không cho phép phát nhúng.' } });
    } else { player.loadVideoById(arg); $('playNote').textContent = ''; }
  } catch { $('playNote').textContent = ' Không tải được trình phát YouTube.'; }
}

function init(j) {
  isFile = !j.url && j.has_audio;
  videoId = j.url ? parseVideoId(j.url) : null;
  $('title').textContent = j.name;
  if (videoId) {  // ảnh bìa video làm nền; maxresdefault không phải video nào cũng có nên lùi về hqdefault
    const base = `https://i.ytimg.com/vi/${videoId}/`, img = new Image();
    img.onload = () => { $('bg').style.backgroundImage = `url(${img.src})`; };
    img.onerror = () => { if (!img.src.endsWith('hqdefault.jpg')) img.src = base + 'hqdefault.jpg'; };
    img.src = base + 'maxresdefault.jpg';
  }
}
function update(j) {
  const first = !started && j.segments.length;
  live = j.status === 'queued' || j.status === 'running';
  segs = j.segments;
  $('check').style.display = segs.length ? 'block' : 'none';
  if (first) { started = true; cur = 0; showSeg(); }
  else if (started) $('pos').textContent = `${cur + 1}/${segs.length}` + (live ? ' (đang nhận dạng...)' : '');
  if (j.status === 'error') msg(j.message, true);
  else if (live) msg(segs.length ? '' : j.message);
  else msg(segs.length ? '' : 'Bài này chưa có câu nào.');
}
function msg(t, err) { $('msg').textContent = t; $('msg').style.display = t ? 'block' : 'none'; $('msg').className = err ? 'err' : ''; }
async function load() {
  $('check').style.display = 'none';
  if (!jobId) return msg('Chưa chọn bài. Hãy tạo subtitle hoặc mở một bài trong thư viện ở trang chủ rồi bấm "Chép chính tả".', true);
  const r = await fetch(`api/jobs/${encodeURIComponent(jobId)}`);
  if (!r.ok) return msg('Không tìm thấy bài này (có thể server đã khởi động lại). Hãy mở lại từ thư viện ở trang chủ.', true);
  const j = await r.json(); init(j); update(j);
  if (live) {
    const t = setInterval(async () => {
      try { update(await (await fetch(`api/jobs/${encodeURIComponent(jobId)}`)).json()); if (!live) clearInterval(t); }
      catch { clearInterval(t); msg('Mất kết nối tới server.', true); }
    }, 1000);
  }
}
const mask = t => t.replace(/[\p{L}\p{N}]/gu, '*');
function renderFirst() {
  const g = segs[cur];
  renderSub();
  // mỗi từ (tách theo khoảng trắng) là một ô gạch dài theo số chữ của từ đó
}
// Ký tự được tính là một ô: chữ, số, và dấu nháy đơn nằm giữa hai chữ (don't, what's).
const LETTER = /[\p{L}\p{N}]/u;
const isSlot = (chars, i) => LETTER.test(chars[i]) || (/['’]/.test(chars[i]) && i > 0 && i < chars.length - 1 && LETTER.test(chars[i - 1]) && LETTER.test(chars[i + 1]));
const slotCount = tok => { const c = Array.from(tok); return c.filter((_, i) => isSlot(c, i)).length; };
let checked = false;  // không còn đặt true (không tô đỏ chỗ sai nữa); giữ để renderSub dùng chung
// Hàng dấu gạch: mỗi từ của câu là một nhóm gạch; chữ gõ vào ô ẩn #typed thay dần các gạch, dấu cách nhảy sang từ kế tiếp.
// Dòng sub (đang che bằng dấu *): chữ nào đã được gõ vào thì dấu * tương ứng đổi sang vàng.
// Chữ đang soạn trong ô gợi ý của bộ gõ (IME) chưa được tính: chỉ chữ đã chốt bằng Enter mới hiện vào dòng sub.
let composing = false, committed = '';  // committed: chữ đã chốt, không gồm chữ đang soạn trong ô gợi ý của IME
function renderSub() {
  const g = segs[cur]; if (!g) return;
  const tokens = committed.split(/\s+/);
  const want = checked ? answerWords() : [], got = checked ? typedWords() : [];
  let wi = -1, curWord = null, lastSp = null;  // curWord: ký tự kế tiếp cần gõ
  const out = g.text.split(/(\s+)/).map(tok => {
    if (/^\s+$/.test(tok)) {  // khoảng trắng cũng là một vị trí: gõ xong từ thì thanh nằm ở đây (màu đỏ) tới khi gõ dấu cách
      const s = document.createElement('span');
      s.className = 'sp'; s.textContent = ' ';
      if (!curWord && wi >= 0 && wi === tokens.length - 1) { curWord = s; s.classList.add('cw'); }
      return s;
    }
    const wrap = document.createDocumentFragment();
    let li = 0, hasLetter = false;
    const chars = Array.from(tok);
    for (let i = 0; i < chars.length; i++) {
      const ch = chars[i];
      if (!isSlot(chars, i)) { wrap.append(ch); continue; }
      if (!hasLetter) { hasLetter = true; wi++; }
      const sp = document.createElement('span');
      sp.textContent = revealed ? ch : '*';
      const tc = Array.from(tokens[wi] || '')[li];  // ký tự đã gõ ở ô này: đúng thì hiện chữ thật, sai vẫn là *
      if (tc !== undefined) {
        sp.className = 'y';
        if (tc.toLowerCase().replace(/’/g, "'") === ch.toLowerCase().replace(/’/g, "'")) sp.textContent = ch;
      }
      if (checked && got[wi] !== want[wi]) sp.className += ' bad';
      if (!curWord && !sp.classList.contains('y')) { curWord = sp; sp.classList.add('cw'); }
      lastSp = sp;
      wrap.append(sp); li++;
    }
    const w = document.createElement('span');
    w.className = 'w'; w.append(wrap);
    return w;
  });
  const prevSeg = segs[cur - 1];  // câu trước đã đánh: hiện nguyên chữ (màu vàng), nối liền trước câu hiện tại
  if (prevSeg) {
    const pv = document.createElement('span');
    pv.className = 'pv'; pv.textContent = prevSeg.text;
    const sep0 = document.createElement('span');
    sep0.className = 'sep'; sep0.textContent = ' ';
    out.unshift(pv, sep0);
  }
  const next = segs[cur + 1];  // câu kế tiếp nối liền sau câu hiện tại, không có dấu / (vẫn che bằng *)
  if (next) {
    const sep = document.createElement('span');
    sep.className = 'sep'; sep.textContent = ' ';
    const nx = document.createElement('span');
    nx.className = 'nx';
    nx.textContent = next.text.split(/(\s+)/).map(tok => {
      const chars = Array.from(tok);
      return /^\s+$/.test(tok) ? ' ' : chars.map((c, i) => isSlot(chars, i) ? '*' : c).join('');
    }).join('');
    out.push(sep, nx);
  }
  $('firstText').replaceChildren(...out);
  const ft = $('firstText');
  const at = curWord || lastSp;  // gõ xong hết thì giữ ký tự cuối ở giữa
  ft.style.transform = at ? `translateX(${$('first').clientWidth / 2 - (at.offsetLeft + at.offsetWidth / 2)}px)` : '';
}
window.addEventListener('resize', () => renderSub());
$('showInput').onclick = () => { $('typed').classList.toggle('vis'); $('typed').focus(); };
$('reveal').onclick = () => { revealed = !revealed; renderSub(); $('typed').focus(); };
$('typed').oninput = e => {
  composing = e.isComposing;  // đang soạn trong ô gợi ý của IME thì chưa tính
  if (!composing) committed = $('typed').value;
  checked = false; renderSub(); autoCheck();
};
// Bộ gõ IME (tiếng Nhật/Trung/Hàn): chữ đang soạn cũng hiện ngay trong hàng gạch, khung gợi ý nằm ở góc dưới màn hình để không che chữ.
['compositionstart', 'compositionupdate', 'compositionend'].forEach(ev => $('typed').addEventListener(ev, e => {
  if (e.type === 'compositionstart') composing = true;
  else if (e.type === 'compositionend') { composing = false; committed = $('typed').value; }
  checked = false; renderSub();
  if (e.type === 'compositionend') autoCheck();
}));
$('typed').onblur = () => setTimeout(() => { if ($('segList').hidden) $('typed').focus(); }, 0);  // luôn giữ focus để gõ phím vào là nhận
function showSeg() {
  clearTimeout(advanceTimer); $('typed').readOnly = false;
  const g = segs[cur];
  $('pos').textContent = `${cur + 1}/${segs.length}`;
  revealed = false; checked = false; $('typed').value = ''; committed = ''; composing = false; renderFirst(); $('typed').focus();
  if (videoId || isFile) playCurrent();
}
// Chế độ chọn câu: cửa sổ hiện toàn bộ script, bấm vào câu nào thì chép câu đó.
function renderSegList() {
  const box = Object.assign(document.createElement('div'), { className: 'box' });
  box.append(...segs.map((g, i) => {
    const row = Object.assign(document.createElement('div'), { className: 'sg' + (i === cur ? ' on' : '') });
    const txt = Object.assign(document.createElement('span'), { textContent: g.text, className: 'tx' });
    const edit = Object.assign(document.createElement('button'), { type: 'button', textContent: '✏️', title: 'Sửa câu này', className: 'ed' });
    row.append(Object.assign(document.createElement('small'), { textContent: `${i + 1}.` }), txt, edit);
    row.onclick = () => { cur = i; showSeg(); $('segList').hidden = true; $('check').scrollIntoView({ behavior: 'smooth' }); };
    edit.onclick = e => {
      e.stopPropagation();
      const inp = Object.assign(document.createElement('input'), { type: 'text', value: g.text, className: 'ei' });
      let done = false;
      const finish = async save => {
        if (done) return; done = true;
        const t = inp.value.trim();
        if (save && t && t !== g.text) {
          const r = await fetch(`api/jobs/${encodeURIComponent(jobId)}/segments/${i}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t }) });
          if (r.ok) { g.text = t; if (i === cur) showSeg(); } else hint('Không lưu được chỗ sửa.');
        }
        txt.textContent = g.text; inp.replaceWith(txt); edit.hidden = false;
      };
      inp.onclick = ev => ev.stopPropagation();
      inp.onkeydown = ev => {
        ev.stopPropagation();
        if (ev.key === 'Enter') finish(true);
        else if (ev.key === 'Escape') finish(false);
      };
      inp.onblur = () => finish(true);
      txt.replaceWith(inp); edit.hidden = true; inp.focus(); inp.select();
    };
    return row;
  }));
  $('segList').replaceChildren(box);
}
$('segList').onclick = e => { if (e.target === $('segList')) { $('segList').hidden = true; $('typed').focus(); } };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('segList').hidden) { $('segList').hidden = true; $('typed').focus(); } });
$('pickSeg').onclick = () => {
  $('segList').hidden = !$('segList').hidden;
  if (!$('segList').hidden) { renderSegList(); $('segList').querySelector('.on')?.scrollIntoView({ block: 'center' }); }
};
// So với đáp án: bỏ dấu câu, không phân biệt hoa/thường.
const norm = chars => chars.filter((_, i) => isSlot(chars, i)).join('').toLowerCase().replace(/’/g, "'");
const answerWords = () => segs[cur].text.split(/\s+/).map(t => norm(Array.from(t))).filter(Boolean);
const typedWords = () => committed.trim().split(/\s+/).filter(Boolean).map(t => Array.from(t).filter(c => LETTER.test(c) || /['’]/.test(c)).join('').toLowerCase().replace(/’/g, "'"));
let hintTimer = null;
function hint(t) { $('playNote').textContent = t; clearTimeout(hintTimer); hintTimer = setTimeout(() => $('playNote').textContent = '', 4000); }
let advanceTimer = null;
// Tự kiểm tra mỗi lần gõ (không dùng phím tắt): gõ đúng cả câu thì qua câu sau, sai hoặc chưa đủ thì giữ nguyên để sửa tiếp.
function autoCheck() {
  if (composing || !segs[cur] || $('typed').readOnly) return;
  const want = answerWords(), got = typedWords();
  if (want.length && want.length === got.length && want.every((w, i) => w === got[i])) {
    revealed = true; renderSub();  // đúng: hiện hết sub, đợi 1 giây rồi mới qua câu mới
    if (cur + 1 < segs.length) {
      $('typed').readOnly = true;
      advanceTimer = setTimeout(() => { cur++; showSeg(); }, 1000);
    }
    else if (live) hint('Đúng! Đang nhận dạng câu tiếp theo, đợi một chút...');
    else { msg('🎉 Đã hoàn thành tất cả các câu!'); }
  }
}
// Ctrl+Space: nghe lại câu hiện tại.
document.addEventListener('keydown', e => {
  if (e.isComposing || !e.ctrlKey || !segs.length || $('check').style.display === 'none') return;
  if (e.code === 'Space') { e.preventDefault(); playCurrent(); }
});
load();
$('typed').focus();
</script>
