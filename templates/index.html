<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio → Subtitle</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1c1f26; --muted:#667085; --line:#d9dde4; --accent:#3b6cf6; --err:#d92d20; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --fg:#e8eaee; --muted:#9aa3b2; --line:#323844; --accent:#6b8cff; --err:#ff6b5e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  input[type=url] { width:100%; font:inherit; padding:12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  input.time { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  input[type=url]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; margin:16px 0; }
  label { display:flex; flex-direction:column; gap:4px; font-size:.85rem; color:var(--muted); flex:1; min-width:140px; }
  select, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { cursor:pointer; }
  a.btn { display:inline-block; margin-bottom:10px; text-decoration:none; padding:8px 10px; border-radius:8px; border:1px solid var(--line); color:var(--fg); }
  a.btn[hidden] { display:none; }
  a.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  progress { width:100%; height:10px; margin-top:16px; }
  #msg { margin:8px 0 0; color:var(--muted); min-height:1.5em; }
  #msg.err { color:var(--err); }
  #out { margin-top:20px; display:none; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; align-items:center; flex-wrap:wrap; }
  .tabs button.on { border-color:var(--accent); color:var(--accent); }
  .spacer { flex:1; }
  .item { display:flex; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .item .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item small { color:var(--muted); }
  textarea { width:100%; height:320px; resize:vertical; font:14px/1.5 ui-monospace, Consolas, monospace;
             background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; }
</style>
</head>
<body>
<main>
  <h1>Audio → Subtitle</h1>
  <p class="sub">Tạo phụ đề (SRT / VTT / TXT) từ link YouTube. Nhận dạng giọng nói chạy trên máy của bạn.</p>

  <div class="card">
    <input id="url" type="url" placeholder="Dán link YouTube, ví dụ https://www.youtube.com/watch?v=..." autocomplete="off" autofocus>
    <div class="tabs" style="margin:10px 0 0">
      <span style="color:var(--muted)">hoặc</span>
      <button id="pick" type="button">📁 Tải file lên</button>
      <input id="file" type="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.flac,.ogg,.opus,.mp4,.mkv,.webm" hidden>
      <span id="fname" style="color:var(--muted)"></span>
      <button id="unpick" type="button" hidden title="Bỏ file">✕</button>
    </div>

    <div class="row">
      <label>Ngôn ngữ
        <select id="lang">{% for l in langs %}<option>{{ l }}</option>{% endfor %}</select>
      </label>
      <label>Từ (bỏ trống = đầu)
        <input id="tstart" class="time" placeholder="0:00" autocomplete="off">
      </label>
      <label>Đến (bỏ trống = hết)
        <input id="tend" class="time" placeholder="5:00" autocomplete="off">
      </label>
    </div>

    <button id="start" class="primary" disabled>Bắt đầu tạo subtitle</button>
    <button id="dlaudio" type="button" disabled title="Tải âm thanh m4a của video về máy">⬇ Tải âm thanh</button>
    <progress id="bar" value="0" max="1" hidden></progress>
    <p id="msg"></p>

    <div id="out">
      <a id="dict" class="btn primary" href="#" hidden>✍️ Chép chính tả</a>
      <div class="tabs" id="tabs">
        {% for f in formats %}<button data-fmt="{{ f }}" class="{{ 'on' if f == 'srt' }}">{{ f|upper }}</button>{% endfor %}
        <span class="spacer"></span>
        <button id="save" title="Lưu vào thư viện để mở lại lần sau">💾 Lưu</button>
        <button id="copy">Sao chép</button>
        <button id="dl" class="primary">Tải xuống</button>
      </div>
      <textarea id="text" readonly hidden></textarea>

    </div>
  </div>

  <div class="card" id="lib" style="margin-top:20px" hidden>
    <h2 style="font-size:1.05rem;margin:0 0 8px">Thư viện đã lưu</h2>
    <div id="libList"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let mode = 'subtitle', jobId = null, segs = [], fmt = 'srt', timer = null, live = false;

const syncDl = () => { $('dlaudio').disabled = !$('url').value.trim(); };
const canStart = () => !!($('url').value.trim() || $('file').files[0]);
$('url').oninput = () => {
  if ($('url').value.trim()) clearFile();
  $('start').disabled = !canStart();
  syncDl();
};
$('url').onkeydown = e => { if (e.key === 'Enter' && !$('start').disabled) $('start').click(); };
$('pick').onclick = () => $('file').click();
function clearFile() { $('file').value = ''; $('fname').textContent = ''; $('unpick').hidden = true; }
$('unpick').onclick = () => { clearFile(); $('start').disabled = !canStart(); };
$('file').onchange = () => {
  const f = $('file').files[0];
  if (f) { $('url').value = ''; $('fname').textContent = f.name; $('unpick').hidden = false; }
  $('start').disabled = !canStart();
  syncDl();
};

function msg(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }

async function startDownload(kind) {
  mode = kind;
  $('dlaudio').disabled = true; $('start').disabled = true; $('out').style.display = 'none';
  $('bar').hidden = false; $('bar').value = 0; msg('Đang gửi yêu cầu...');
  try {
    const r = await fetch('api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: $('url').value.trim(), mode: kind }) });
    const raw = await r.text();
    let j = {}; try { j = JSON.parse(raw); } catch {}
    if (!r.ok || !j.id) throw new Error(j.error || `Lỗi (HTTP ${r.status}).`);
    jobId = j.id; poll();
  } catch (e) { msg(e.message, true); $('bar').hidden = true; syncDl(); $('start').disabled = !canStart(); }
}
$('dlaudio').onclick = () => startDownload('audio');
$('start').onclick = async () => {
  mode = 'subtitle';
  const f = $('file').files[0];
  let body, headers = {};
  if (f) {
    body = new FormData();
    body.append('file', f); body.append('lang', $('lang').value);
    body.append('start', $('tstart').value); body.append('end', $('tend').value);
  } else {
    body = JSON.stringify({ url: $('url').value.trim(), lang: $('lang').value,
      start: $('tstart').value, end: $('tend').value });
    headers = { 'Content-Type': 'application/json' };
  }
  $('start').disabled = true; $('out').style.display = 'none'; live = false;
  $('bar').hidden = false; $('bar').value = 0; msg('Đang gửi yêu cầu...');
  try {
    const r = await fetch('api/jobs', { method: 'POST', headers, body });
    const raw = await r.text();
    let j = {}; try { j = JSON.parse(raw); } catch {}
    if (!r.ok || !j.id) {
      const hint = r.status === 413 ? 'File quá lớn so với giới hạn của server (nginx cần tăng client_max_body_size).'
                 : r.status >= 500 ? `Server gặp lỗi (HTTP ${r.status}). Xem log của server.` : `Lỗi tải lên (HTTP ${r.status}).`;
      throw new Error(j.error || hint);
    }
    jobId = j.id; poll();
  } catch (e) { msg(e.message, true); $('start').disabled = !canStart(); $('bar').hidden = true; }
};

function poll() {
  timer = setInterval(async () => {
    try {
      const j = await (await fetch(`api/jobs/${jobId}`)).json();
      $('bar').value = j.progress; msg(j.message, j.status === 'error');
      if (j.status === 'done' && mode !== 'subtitle') {
        clearInterval(timer); $('bar').hidden = true; syncDl(); $('start').disabled = !canStart();
        msg('Đã tải xong, file đang được lưu về máy.'); location.href = `api/jobs/${jobId}/file`;
      }
      else if (j.status === 'done') {
        clearInterval(timer);
        segs = j.segments; finish();
      }
      else if (mode === 'subtitle' && j.segments.length) addLive(j.segments);
      else if (j.status === 'error') { clearInterval(timer); $('start').disabled = !canStart(); syncDl(); $('bar').hidden = true; }
    } catch (e) { clearInterval(timer); msg('Mất kết nối tới server.', true); $('start').disabled = false; }
  }, 800);
}

async function show() {
  $('text').value = await (await fetch(`api/jobs/${jobId}/result?fmt=${fmt}`)).text();
}
// Hiện ngay các câu đã nhận dạng được trong lúc job còn chạy.
function showDict() {
  $('dict').hidden = !segs.length;
  $('dict').href = `dictation?id=${jobId}`;
}
function addLive(list) {
  segs = list; live = true;
  $('out').style.display = 'block'; $('tabs').style.display = 'none'; $('text').hidden = true;
  showDict();
}
async function finish() {
  live = false;
  $('start').disabled = false; $('bar').hidden = true; $('out').style.display = 'block'; $('tabs').style.display = 'flex'; await show();
  showDict();
}
async function loadLib() {
  const items = await (await fetch('api/library')).json();
  $('lib').hidden = !items.length;
  $('libList').replaceChildren(...items.map(it => {
    const row = document.createElement('div'); row.className = 'item';
    const nm = Object.assign(document.createElement('span'), { className: 'nm', textContent: it.name, title: it.name });
    const info = Object.assign(document.createElement('small'), { textContent: `${it.count} câu` });
    const open = Object.assign(document.createElement('button'), { textContent: 'Mở & chép chính tả', className: 'primary' });
    const del = Object.assign(document.createElement('button'), { textContent: '🗑', title: 'Xoá khỏi thư viện' });
    open.onclick = async () => {
      const r = await fetch(`api/library/${it.id}/load`, { method: 'POST' });
      const j = await r.json();
      if (!r.ok) return msg(j.error || 'Không mở được.', true);
      location.href = `dictation?id=${j.id}`;
    };
    del.onclick = async () => {
      if (!confirm(`Xoá "${it.name}" khỏi thư viện?`)) return;
      await fetch(`api/library/${it.id}`, { method: 'DELETE' }); loadLib();
    };
    row.append(nm, info, open, del); return row;
  }));
}
$('save').onclick = async () => {
  const r = await fetch(`api/jobs/${jobId}/save`, { method: 'POST' });
  $('save').textContent = r.ok ? '✓ Đã lưu' : 'Lỗi khi lưu';
  setTimeout(() => $('save').textContent = '💾 Lưu', 1500);
  if (r.ok) loadLib();
};
loadLib();
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-fmt]'); if (!b) return;
  fmt = b.dataset.fmt;
  document.querySelectorAll('[data-fmt]').forEach(x => x.classList.toggle('on', x === b));
  show();
});
$('dl').onclick = () => { location.href = `api/jobs/${jobId}/result?fmt=${fmt}&download=1`; };
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('text').value); $('copy').textContent = 'Đã chép'; }
  catch { $('text').select(); document.execCommand('copy'); }
  setTimeout(() => $('copy').textContent = 'Sao chép', 1500);
};
</script>
</body>
</html>
