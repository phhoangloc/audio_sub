<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio → Subtitle</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1c1f26; --muted:#667085; --line:#d9dde4; --accent:#3b6cf6; --err:#d92d20; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --fg:#e8eaee; --muted:#9aa3b2; --line:#323844; --accent:#6b8cff; --err:#ff6b5e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  input[type=url] { width:100%; font:inherit; padding:12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  input.time { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  input[type=url]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; margin:16px 0; }
  label { display:flex; flex-direction:column; gap:4px; font-size:.85rem; color:var(--muted); flex:1; min-width:140px; }
  select, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { cursor:pointer; }
  a.btn { display:inline-block; margin-bottom:10px; text-decoration:none; padding:8px 10px; border-radius:8px; border:1px solid var(--line); color:var(--fg); }
  a.btn[hidden] { display:none; }
  a.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .ib { display:inline-flex; align-items:center; justify-content:center; gap:2px; min-width:40px; height:40px; padding:0 10px; vertical-align:middle; transition:transform .12s, border-color .12s, color .12s; }
  .ib:not(:disabled):hover { transform:translateY(-1px); border-color:var(--accent); color:var(--accent); }
  .ib.primary:not(:disabled):hover { color:#fff; filter:brightness(1.1); }
  .ib[hidden] { display:none; }
  a.btn.ib { margin-bottom:10px; }
  .ib .sm { width:14px; height:14px; }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  progress { width:100%; height:10px; margin-top:16px; }
  #msg { margin:8px 0 0; color:var(--muted); min-height:1.5em; }
  #msg.err { color:var(--err); }
  #out { margin-top:20px; display:none; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; align-items:center; flex-wrap:wrap; }
  .tabs button.on { border-color:var(--accent); color:var(--accent); }
  .spacer { flex:1; }
  .item { display:flex; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .item .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item small { color:var(--muted); }
  textarea { width:100%; height:320px; resize:vertical; font:14px/1.5 ui-monospace, Consolas, monospace;
             background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-captions" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4m4 0h2M7 11h2m4 0h4"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><path d="m16 13 5.22 3.48a.5.5 0 0 0 .78-.41V7.87a.5.5 0 0 0-.75-.4L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7M7 3v4a1 1 0 0 0 1 1h7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></symbol>
  <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
</svg>
<main>
  <h1>Audio → Subtitle</h1>
  <p class="sub">Create subtitles (SRT / VTT / TXT) from a YouTube link or an audio/video file, transcribed by Gemini.</p>

  <div class="card">
    <input id="url" type="url" placeholder="Paste a YouTube link, e.g. https://www.youtube.com/watch?v=..." autocomplete="off" autofocus>
    <div class="tabs" style="margin:10px 0 0">
      <span style="color:var(--muted)">or</span>
      <button id="pick" type="button" class="ib" title="Upload an audio/video file" aria-label="Upload file"><svg class="i"><use href="#i-folder"/></svg></button>
      <input id="file" type="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.flac,.ogg,.opus,.mp4,.mkv,.webm" hidden>
      <span id="fname" style="color:var(--muted)"></span>
      <button id="unpick" type="button" class="ib" hidden title="Remove file" aria-label="Remove file"><svg class="i"><use href="#i-x"/></svg></button>
    </div>

    <div class="row">
      <label>Language
        <select id="lang">__LANG_OPTIONS__</select>
      </label>
      <label>From (blank = start)
        <input id="tstart" class="time" placeholder="0:00" autocomplete="off">
      </label>
      <label>To (blank = end)
        <input id="tend" class="time" placeholder="5:00" autocomplete="off">
      </label>
    </div>

    <button id="start" class="primary ib" disabled title="Generate subtitles" aria-label="Generate subtitles"><svg class="i"><use href="#i-captions"/></svg></button>
    <button id="dlaudio" type="button" class="ib" disabled title="Download the video's audio (m4a)" aria-label="Download audio"><svg class="i sm"><use href="#i-download"/></svg><svg class="i"><use href="#i-music"/></svg></button>
    <button id="dlvideo" type="button" class="ib" disabled title="Download the video (mp4)" aria-label="Download video"><svg class="i sm"><use href="#i-download"/></svg><svg class="i"><use href="#i-video"/></svg></button>
    <progress id="bar" value="0" max="1" hidden></progress>
    <p id="msg"></p>

    <div id="out">
      <a id="dict" class="btn primary ib" href="#" hidden title="Dictation practice" aria-label="Dictation"><svg class="i"><use href="#i-headphones"/></svg></a>
      <div class="tabs" id="tabs">
        __FORMAT_BUTTONS__
        <span class="spacer"></span>
        <button id="save" class="ib" title="Save to the library to reopen later" aria-label="Save"><svg class="i"><use href="#i-save"/></svg></button>
        <button id="copy" class="ib" title="Copy" aria-label="Copy"><svg class="i"><use href="#i-copy"/></svg></button>
        <button id="dl" class="primary ib" title="Download subtitle file" aria-label="Download"><svg class="i"><use href="#i-download"/></svg></button>
      </div>
      <textarea id="text" readonly hidden></textarea>

    </div>
  </div>

  <div class="card" id="lib" style="margin-top:20px" hidden>
    <h2 style="font-size:1.05rem;margin:0 0 8px">Saved library</h2>
    <div id="libList"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let mode = 'subtitle', jobId = null, segs = [], fmt = 'srt', timer = null, live = false;

const syncDl = () => { $('dlaudio').disabled = $('dlvideo').disabled = !$('url').value.trim(); };
const canStart = () => !!($('url').value.trim() || $('file').files[0]);
$('url').oninput = () => {
  if ($('url').value.trim()) clearFile();
  $('start').disabled = !canStart();
  syncDl();
};
$('url').onkeydown = e => { if (e.key === 'Enter' && !$('start').disabled) $('start').click(); };
$('pick').onclick = () => $('file').click();
function clearFile() { $('file').value = ''; $('fname').textContent = ''; $('unpick').hidden = true; }
$('unpick').onclick = () => { clearFile(); $('start').disabled = !canStart(); };
$('file').onchange = () => {
  const f = $('file').files[0];
  if (f) { $('url').value = ''; $('fname').textContent = f.name; $('unpick').hidden = false; }
  $('start').disabled = !canStart();
  syncDl();
};

const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
function flash(b, n) { const old = b.innerHTML; b.innerHTML = ic(n); setTimeout(() => b.innerHTML = old, 1500); }
function iconBtn(n, title, cls = 'ib') { const b = document.createElement('button'); b.className = cls; b.title = title; b.setAttribute('aria-label', title); b.innerHTML = ic(n); return b; }
function msg(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }

async function startDownload(kind) {
  mode = kind;
  $('dlaudio').disabled = $('dlvideo').disabled = true; $('start').disabled = true; $('out').style.display = 'none';
  $('bar').hidden = false; $('bar').value = 0; msg('Sending request...');
  try {
    const r = await fetch('api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: $('url').value.trim(), mode: kind }) });
    const raw = await r.text();
    let j = {}; try { j = JSON.parse(raw); } catch {}
    if (!r.ok || !j.id) throw new Error(j.error || `Error (HTTP ${r.status}).`);
    jobId = j.id; poll();
  } catch (e) { msg(e.message, true); $('bar').hidden = true; syncDl(); $('start').disabled = !canStart(); }
}
$('dlaudio').onclick = () => startDownload('audio');
$('dlvideo').onclick = () => startDownload('video');
$('start').onclick = async () => {
  mode = 'subtitle';
  const f = $('file').files[0];
  let body, headers = {};
  if (f) {
    body = new FormData();
    body.append('file', f); body.append('lang', $('lang').value);
    body.append('start', $('tstart').value); body.append('end', $('tend').value);
  } else {
    body = JSON.stringify({ url: $('url').value.trim(), lang: $('lang').value,
      start: $('tstart').value, end: $('tend').value });
    headers = { 'Content-Type': 'application/json' };
  }
  $('start').disabled = true; $('out').style.display = 'none'; live = false;
  $('bar').hidden = false; $('bar').value = 0; msg('Sending request...');
  try {
    const r = await fetch('api/jobs', { method: 'POST', headers, body });
    const raw = await r.text();
    let j = {}; try { j = JSON.parse(raw); } catch {}
    if (!r.ok || !j.id) {
      const hint = r.status === 413 ? 'File exceeds the server upload limit (nginx needs a larger client_max_body_size).'
                 : r.status >= 500 ? `Server error (HTTP ${r.status}). Check the server log.` : `Upload failed (HTTP ${r.status}).`;
      throw new Error(j.error || hint);
    }
    jobId = j.id; poll();
  } catch (e) { msg(e.message, true); $('start').disabled = !canStart(); $('bar').hidden = true; }
};

function poll() {
  timer = setInterval(async () => {
    try {
      const j = await (await fetch(`api/jobs/${jobId}`)).json();
      $('bar').value = j.progress; msg(j.message, j.status === 'error');
      if (j.status === 'done' && mode !== 'subtitle') {
        clearInterval(timer); $('bar').hidden = true; syncDl(); $('start').disabled = !canStart();
        msg('Download ready, saving the file.'); location.href = `api/jobs/${jobId}/file`;
      }
      else if (j.status === 'done') {
        clearInterval(timer);
        segs = j.segments; finish();
      }
      else if (mode === 'subtitle' && j.segments.length) addLive(j.segments);
      else if (j.status === 'error') { clearInterval(timer); $('start').disabled = !canStart(); syncDl(); $('bar').hidden = true; }
    } catch (e) { clearInterval(timer); msg('Lost connection to the server.', true); $('start').disabled = false; }
  }, 800);
}

async function show() {
  $('text').value = await (await fetch(`api/jobs/${jobId}/result?fmt=${fmt}`)).text();
}
// Hiện ngay các câu đã nhận dạng được trong lúc job còn chạy.
function showDict() {
  $('dict').hidden = !segs.length;
  $('dict').href = `dictation?id=${jobId}`;
}
function addLive(list) {
  segs = list; live = true;
  $('out').style.display = 'block'; $('tabs').style.display = 'none'; $('text').hidden = true;
  showDict();
}
async function finish() {
  live = false;
  $('start').disabled = false; $('bar').hidden = true; $('out').style.display = 'block'; $('tabs').style.display = 'flex'; await show();
  showDict();
}
async function loadLib() {
  const items = await (await fetch('api/library')).json();
  $('lib').hidden = !items.length;
  $('libList').replaceChildren(...items.map(it => {
    const row = document.createElement('div'); row.className = 'item';
    const nm = Object.assign(document.createElement('span'), { className: 'nm', textContent: it.name, title: it.name });
    const info = Object.assign(document.createElement('small'), { textContent: `${it.count} lines` });
    const open = iconBtn('headphones', 'Open & dictate', 'primary ib');
    const ren = iconBtn('pencil', 'Rename');
    const del = iconBtn('trash', 'Remove from library');
    ren.onclick = async () => {
      const name = prompt('New name:', it.name);
      if (name === null || !name.trim() || name.trim() === it.name) return;
      const r = await fetch(`api/library/${it.id}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }),
      });
      if (!r.ok) return msg((await r.json()).error || 'Could not rename.', true);
      loadLib();
    };
    open.onclick = async () => {
      const r = await fetch(`api/library/${it.id}/load`, { method: 'POST' });
      const j = await r.json();
      if (!r.ok) return msg(j.error || 'Could not open.', true);
      location.href = `dictation?id=${j.id}`;
    };
    del.onclick = async () => {
      if (!confirm(`Remove "${it.name}" from the library?`)) return;
      await fetch(`api/library/${it.id}`, { method: 'DELETE' }); loadLib();
    };
    row.append(nm, info, open, ren, del); return row;
  }));
}
$('save').onclick = async () => {
  const r = await fetch(`api/jobs/${jobId}/save`, { method: 'POST' });
  flash($('save'), r.ok ? 'check' : 'alert');
  if (!r.ok) msg('Save failed.', true);
  if (r.ok) loadLib();
};
loadLib();
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-fmt]'); if (!b) return;
  fmt = b.dataset.fmt;
  document.querySelectorAll('[data-fmt]').forEach(x => x.classList.toggle('on', x === b));
  show();
});
$('dl').onclick = () => { location.href = `api/jobs/${jobId}/result?fmt=${fmt}&download=1`; };
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('text').value); }
  catch { $('text').select(); document.execCommand('copy'); }
  flash($('copy'), 'check');
};
</script>
</body>
</html>
