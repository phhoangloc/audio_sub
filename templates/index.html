<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio → Subtitle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  /* Chỉ 2 màu: trắng và xám. */
  /* Nền xám, chữ/viền/icon trắng. --fg là màu "mực" dùng cho mọi chữ, viền, icon. */
  :root { color-scheme:dark; --white:#fff; --gray:#6b6b6b; --fg-rgb:255,255,255;
          --bg:var(--gray); --card:var(--gray); --fg:var(--white); --muted:var(--white); --line:var(--white); --accent:var(--white); --err:var(--white); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
  input::placeholder { color:var(--fg); opacity:.6; }
  main { width:100%; min-height:100vh; min-height:100dvh; margin:0; padding:32px 16px;
         display:flex; flex-direction:column; justify-content:center; }
  /* Chỉ cụm công cụ bị giới hạn chiều rộng, canh giữa. */
  #tools { width:100%; max-width:720px; margin:0 auto; display:flex; flex-direction:column; }
  .bar { position:relative; display:flex; }
  input[type=url] { flex:1; min-width:0; font:inherit; padding:14px 60px 14px 24px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  input[type=url]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  /* Nút Generate: icon viền xám nằm bên phải, trong ô nhập. */
  #start { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:40px; height:40px; padding:0;
           display:flex; align-items:center; justify-content:center; border:0; border-radius:50%;
           background:transparent; color:var(--fg); cursor:pointer; }
  #start svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #start:disabled { opacity:.4; cursor:not-allowed; }
  #start:focus-visible { outline:2px solid var(--fg); }
  /* Vòng progress quanh icon Generate khi đang chạy. */
  #start.busy { opacity:1; cursor:progress; }
  #start .ring { position:absolute; inset:0; width:40px; height:40px; transform:rotate(-90deg); stroke-width:3.5; display:none; }
  #start.busy .ring { display:block; }
  #start.busy .icon { opacity:.35; }
  .ring .track { stroke:var(--fg); opacity:.25; }
  .ring .arc { stroke:var(--fg); stroke-linecap:round; stroke-dasharray:100.5; stroke-dashoffset:100.5; transition:stroke-dashoffset .4s; }
  .ring.spin { animation:spin 1s linear infinite; }
  .ring.spin .arc { stroke-dashoffset:70; transition:none; }
  @keyframes spin { from { transform:rotate(-90deg); } to { transform:rotate(270deg); } }
  input[type=url]:disabled { opacity:.6; cursor:not-allowed; }
  .files { display:flex; align-items:center; gap:12px; margin:12px 0 0 24px; min-width:0; }
  #fname { color:var(--fg); font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  /* "add a file" bên dưới ô nhập, trông như một đường link. */
  #pick { flex:none; display:inline-flex; align-items:center; gap:4px; max-width:100%;
          font:inherit; font-size:.95rem; padding:0; border:0; background:none; color:var(--fg); cursor:pointer; }
  #pick svg { flex:none; width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
  #pick span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-decoration:underline; text-underline-offset:3px; }
  #pick:hover span { text-decoration-thickness:2px; }
  #pick:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  #pick:disabled { opacity:.4; cursor:not-allowed; }
  #msg { margin:8px 0 0; color:var(--muted); min-height:1.5em; padding-left:24px; }
  /* Danh sách bài đã lưu, dưới "add a file". */
  #saved { list-style:none; margin:8px 0 0; padding:0; }
  #saved[hidden] { display:none; }
  #saved li + li { border-top:1px solid rgba(var(--fg-rgb),.15); }
  #saved li { position:relative; display:flex; align-items:center; }
  #saved li:hover { background:rgba(var(--fg-rgb),.08); }
  #saved .open { flex:1; min-width:0; display:flex; align-items:center; gap:12px; padding:10px 8px 10px 24px; border:0; background:none;
                 color:var(--fg); font:inherit; font-size:.95rem; text-align:left; cursor:pointer; }
  #saved button:focus-visible, #saved input:focus-visible { outline:2px solid var(--fg); outline-offset:-2px; }
  #saved button:disabled { opacity:.4; cursor:not-allowed; }
  #saved .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #saved small { flex:none; opacity:.6; }
  /* Nút ba chấm dọc + menu Edit / Delete. */
  #saved .more { flex:none; width:32px; height:32px; margin-right:12px; padding:0; border:0; border-radius:50%; display:flex;
                 align-items:center; justify-content:center; background:none; color:var(--fg); cursor:pointer; }
  #saved .more:hover { background:rgba(var(--fg-rgb),.12); }
  #saved .more svg { width:18px; height:18px; fill:currentColor; }
  #saved .menu { position:absolute; right:12px; top:calc(100% - 4px); z-index:10; min-width:120px; margin:0; padding:4px 0; list-style:none;
                 border:1px solid rgba(var(--fg-rgb),.25); border-radius:10px; background:var(--bg); }
  #saved .menu[hidden] { display:none; }
  #saved .menu button { width:100%; padding:8px 16px; border:0; background:none; color:var(--fg); font:inherit; font-size:.95rem; text-align:left; cursor:pointer; }
  #saved .menu button:hover { background:rgba(var(--fg-rgb),.12); }
  #saved .rename { flex:1; min-width:0; margin:4px 8px 4px 16px; padding:6px 8px; font:inherit; font-size:.95rem;
                   border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  /* Khoảng thời gian cắt từ link YouTube: chỉ hiện khi ô nhập là link YouTube. */
  .range { display:flex; align-items:center; gap:12px; margin:12px 0 0 24px; font-size:.95rem; color:var(--fg); }
  .range[hidden] { display:none; }
  .range label { display:flex; align-items:center; gap:8px; }
  .range input { width:5.5em; padding:6px 12px; border-radius:999px; border:1px solid rgba(var(--fg-rgb),.5);
                 background:var(--bg); color:var(--fg); font:inherit; text-align:center; font-variant-numeric:tabular-nums; }
  .range input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .range input:disabled { opacity:.6; }
  #msg.err { color:var(--err); font-weight:600; }
  /* Danh sách các câu đã nhận dạng được. */
  /* Khi đã có script: ẩn công cụ, chỉ còn "← back" và danh sách câu. */
  main.script { justify-content:flex-start; }
  main.script #tools { display:none; }
  #nav { align-self:stretch; margin:0 24px; display:flex; align-items:center; gap:20px; }
  /* Nút save: cùng hàng với các icon, đẩy sang góc phải. */
  #saveBtn { margin-left:auto; display:inline-flex; padding:0; border:0; background:none; color:var(--fg); cursor:pointer; }
  #saveBtn:hover { opacity:.7; }
  #saveBtn:disabled { opacity:.4; cursor:default; }
  #saveBtn:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  #saveBtn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #nav[hidden] { display:none; }
  #back { display:inline-flex; align-items:center; gap:4px;
          font:inherit; font-size:.95rem; padding:0; border:0; background:none; color:var(--fg); cursor:pointer; }
  #listBtn { display:inline-flex; padding:0; border:0; background:none; color:var(--fg); cursor:pointer; }
  #listBtn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #listBtn:hover { opacity:.7; }
  #listBtn:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  /* Danh sách câu: thả xuống ngay dưới icon list. */
  .listWrap { position:relative; display:inline-flex; }
  #lines { position:absolute; top:calc(100% + 8px); left:0; z-index:10; width:min(360px, calc(100vw - 56px)); max-height:50vh;
           overflow:auto; list-style:none; margin:0; padding:4px 0; border:1px solid rgba(var(--fg-rgb),.25); border-radius:12px; background:var(--bg); }
  #lines[hidden] { display:none; }
  #lines li { display:flex; align-items:center; gap:12px; padding:8px 16px; border-top:1px solid rgba(var(--fg-rgb),.15); font-size:.95rem; }
  #lines li:first-child { border-top:0; }
  /* Nút play/pause đầu mỗi câu, có vòng thời gian khi đang phát. */
  .play { position:relative; flex:none; width:28px; height:28px; padding:0; border:0; border-radius:50%;
          display:flex; align-items:center; justify-content:center; background:none; color:var(--fg); cursor:pointer; }
  .play:focus-visible { outline:2px solid var(--fg); outline-offset:1px; }
  .play .ic { width:12px; height:12px; fill:currentColor; }
  .play .ic-pause, .play.on .ic-play { display:none; }
  .play.on .ic-pause { display:block; }
  .play .pring { position:absolute; inset:0; width:28px; height:28px; transform:rotate(-90deg); fill:none; stroke:currentColor; stroke-width:2; }
  .play .pring .track { opacity:.25; }
  .play .pring .arc { stroke-linecap:round; stroke-dasharray:75.4; stroke-dashoffset:75.4; }
  #lines li.playing span { font-weight:600; }
  #lines span { flex:1; }
  /* Nút select cuối mỗi câu: chọn câu để hiện ở cuối trang. */
  .sel { flex:none; width:28px; height:28px; padding:0; border:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
         background:none; color:var(--fg); cursor:pointer; opacity:.5; }
  .sel:hover, .sel.on { opacity:1; }
  .sel:focus-visible { outline:2px solid var(--fg); outline-offset:1px; }
  .sel svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .sel .dot { display:none; fill:currentColor; stroke:none; }
  .sel.on .dot { display:block; }
  /* Câu đã chọn: hiện ở cuối trang, canh giữa, kèm ô gõ đáp án bên dưới. */
  #quiz { position:fixed; left:0; right:0; bottom:0; padding:24px 16px 32px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  #quiz[hidden] { display:none; }
  #caption, #answer { font-family:"Lora", "Mochiy Pop One", Georgia, "Times New Roman", serif; } /* Lora không có chữ Nhật nên chữ Nhật tự lấy Mochiy Pop One */
  #caption { margin:0; text-align:center; font-size:1.5rem; letter-spacing:.01em; white-space:pre-wrap; }
  /* Kiểm tra chính tả: ký tự đúng = vàng, gõ sai = '*' đỏ, ký tự cần gõ tiếp = gạch chân. */
  :root { --ok:#ffd54a; --bad:#ff8f8f; }
  #caption .ok { color:var(--ok); }
  #caption .bad { color:var(--bad); }
  #caption .congrats { color:var(--ok); }
  #caption .cur { text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:6px; }
  /* Ô gõ đáp án được ẩn: vẫn nhận phím, kết quả chỉ hiện trên câu bên trên. */
  #answer { position:absolute; width:1px; height:1px; padding:0; border:0; opacity:0; pointer-events:none; }
  #caption { cursor:text; }
  /* Bật hỗ trợ: hiện lại ô gõ để thấy mình đang gõ gì. */
  #quiz.show-input #answer { position:static; width:100%; max-width:720px; height:auto; opacity:1; pointer-events:auto;
            font-size:1.15rem; text-align:center; padding:12px 24px; border-radius:999px;
            border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  #quiz.show-input #answer:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  #inputBtn { display:inline-flex; padding:0; border:0; background:none; color:var(--fg); cursor:pointer; opacity:.5; }
  #inputBtn[aria-pressed="true"], #inputBtn:hover { opacity:1; }
  #inputBtn:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  #inputBtn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #lines span { min-width:0; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:1; line-clamp:1; }
  #back svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #back span { text-decoration:underline; text-underline-offset:3px; }
  #back:hover span { text-decoration-thickness:2px; }
  #back:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
</style>
</head>
<body>
<main id="main">
  <div id="tools">
  <div class="bar">
    <input id="url" type="url" placeholder="Paste a YouTube link" autocomplete="off" autofocus>
    <button id="start" disabled title="Generate subtitles" aria-label="Generate subtitles">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4m4 0h2M7 11h2m4 0h4"/></svg>
      <svg class="ring" id="ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="track" cx="20" cy="20" r="16"/><circle class="arc" id="arc" cx="20" cy="20" r="16"/></svg>
    </button>
  </div>
  <div class="range" id="range" hidden>
    <label>Start <input id="tstart" value="0:00" inputmode="numeric" autocomplete="off" aria-label="Start time (m:ss)"></label>
    <span aria-hidden="true">–</span>
    <label>End <input id="tend" value="0:30" inputmode="numeric" autocomplete="off" aria-label="End time (m:ss)"></label>
  </div>
  <div class="files">
    <button id="pick" type="button" title="Upload an audio/video file">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>add a file</span>
    </button>
    <span id="fname"></span>
  </div>
  <input id="file" type="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.flac,.ogg,.opus,.mp4,.mkv,.webm" hidden>
  <p id="msg"></p>
  <ol id="saved" hidden aria-label="Saved scripts"></ol>
  </div>
  <div id="nav" hidden>
    <button id="back" type="button" title="Clear this script and make a new one">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>back</span>
    </button>
    <span class="listWrap">
    <button id="listBtn" type="button" title="Show sentences" aria-label="Show sentences" aria-expanded="false" aria-controls="lines">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    </button>
    <ol id="lines" hidden></ol>
    <audio id="player" preload="auto" hidden></audio>
    </span>
    <button id="inputBtn" type="button" title="Show the answer box" aria-label="Show the answer box" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
    </button>
    <button id="saveBtn" type="button" title="Save to the library" aria-label="Save to the library"></button>
  </div>
  <div id="quiz" hidden>
    <p id="caption" aria-live="polite"></p>
    <input id="answer" type="text" placeholder="Type what you hear" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer">
  </div>
</main>


<script>
const $ = id => document.getElementById(id);
let jobId = null, timer = null, file = null, busy = false, segments = [];

const canStart = () => !!($('url').value.trim() || file);
function msg(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }
function setFile(f) { file = f; $('fname').textContent = f ? f.name : ''; $('fname').title = f ? f.name : ''; }

// Vòng tròn progress: p < 0 = chưa biết tiến độ (xoay), 0..1 = phần trăm.
const CIRC = 100.5;
function setProgress(p) {
  $('ring').classList.toggle('spin', p <= 0);
  $('arc').style.strokeDashoffset = p > 0 ? CIRC * (1 - Math.min(p, 1)) : '';
}
// Đang chạy: khóa ô nhập, "add a file" và nút Generate.
function setBusy(on) {
  busy = on;
  $('url').disabled = $('pick').disabled = $('tstart').disabled = $('tend').disabled = on;
  $('saved').querySelectorAll('button').forEach(b => b.disabled = on);
  $('start').classList.toggle('busy', on);
  $('start').setAttribute('aria-busy', on);
  $('start').disabled = on || !canStart();
  if (on) setProgress(0);
}

// Hiện ô Start / End khi ô nhập là link YouTube.
const isYoutube = v => /^(https?:\/\/)?([\w-]+\.)?(youtube\.com|youtu\.be)\//i.test(v.trim());
const syncRange = () => { $('range').hidden = !isYoutube($('url').value); };
$('url').oninput = () => {
  if ($('url').value.trim()) setFile(null);
  $('start').disabled = !canStart();
  syncRange();
};
for (const id of ['tstart', 'tend'])
  $(id).onkeydown = e => { if (e.key === 'Enter' && !$('start').disabled) $('start').click(); };
$('url').onkeydown = e => { if (e.key === 'Enter' && !$('start').disabled) $('start').click(); };
$('pick').onclick = () => $('file').click();
$('file').onchange = () => {
  const f = $('file').files[0];
  $('file').value = '';            // cho phép chọn lại cùng một file lần sau
  if (!f || busy) return;
  $('url').value = ''; setFile(f); syncRange();
  generate();                      // tự động Generate ngay sau khi chọn file (không dùng .click(): nút đang disabled sẽ bỏ qua click)
};

async function generate() {
  if (busy || !canStart()) return;
  let body, headers = {};
  if (file) { body = new FormData(); body.append('file', file); }
  else {
    body = JSON.stringify({ url: $('url').value.trim(), start: $('tstart').value.trim(), end: $('tend').value.trim() });
    headers = { 'Content-Type': 'application/json' };
  }
  setBusy(true); msg('Sending request...');
  try {
    const r = await fetch('api/jobs', { method: 'POST', headers, body });
    let j = {}; try { j = JSON.parse(await r.text()); } catch {}
    if (!r.ok || !j.id) throw new Error(j.error || `Request failed (HTTP ${r.status}).`);
    jobId = j.id; poll();
  } catch (e) { msg(e.message, true); setBusy(false); }
}
$('start').onclick = generate;

// Chế độ xem script: ẩn công cụ, hiện "← back".
function showScript(on) {
  $('main').classList.toggle('script', on);
  if (!on) toggleList(false);
  $('nav').hidden = !on;
}

// Danh sách câu đã generate, thả xuống dưới icon list.
function playButton(seg) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'play'; b.setAttribute('aria-label', 'Play');
  b.innerHTML = '<svg class="pring" viewBox="0 0 28 28" aria-hidden="true"><circle class="track" cx="14" cy="14" r="12"/><circle class="arc" cx="14" cy="14" r="12"/></svg>'
    + '<svg class="ic ic-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z"/></svg>'
    + '<svg class="ic ic-pause" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.5h2.5v9H2.5zM7 1.5h2.5v9H7z"/></svg>';
  b.onclick = () => (seg === playing && !$('player').paused) ? pauseSeg() : playSeg(seg);
  return b;
}
let selected = null;
function selectButton(seg) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'sel' + (seg === selected ? ' on' : '');
  b.title = 'Show this sentence'; b.setAttribute('aria-label', 'Select sentence'); b.setAttribute('aria-pressed', seg === selected);
  b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle class="dot" cx="12" cy="12" r="4.5"/></svg>';
  // Chọn câu để kiểm tra: phát âm thanh câu đó, hiện chữ ở cuối trang và đóng danh sách.
  b.onclick = () => { selectSeg(seg); playSeg(seg); toggleList(false); };
  return b;
}
// Chọn câu: hiện chữ của câu ở cuối trang; nút select của câu đó được đánh dấu.
// Kiểm tra chính tả: so từng ký tự đáp án với câu gốc (không phân biệt hoa thường).
// Ký tự gõ đúng vị trí thì hiện ra, còn lại vẫn là '*'; khoảng trắng luôn giữ nguyên.
const norm = c => c.toLocaleLowerCase();
const isPunct = c => /[\p{P}\p{S}]/u.test(c);
// Đủ câu khi khớp từng chữ và dấu cách (bỏ qua hoa thường, dấu câu, khoảng trắng thừa ở đầu/cuối).
const core = t => [...t].filter(c => !isPunct(c)).map(norm).join('').replace(/\s+/g, ' ').trim();
const isComma = c => /[,、，]/.test(c);
function renderCaption() {
  if (completed) return;
  if (!selected) { $('caption').textContent = ''; return; }
  const text = [...selected.text];
  // Dấu phẩy người gõ có gõ hay không cũng được: bỏ khỏi đáp án trước khi so.
  const typed = [...$('answer').value].filter(c => !isComma(c));
  const solved = core($('answer').value) === core(selected.text);
  // Dấu câu ở cuối câu (. ! ? 。…) và dấu phẩy giữa câu luôn hiện sẵn, không cần gõ.
  let tail = text.length;
  while (tail > 0 && (isPunct(text[tail - 1]) || /\s/.test(text[tail - 1]))) tail--;
  const shown = i => i >= tail || isComma(text[i]);
  let k = 0;                        // thứ tự ký tự cần gõ (bỏ qua các dấu hiện sẵn)
  $('caption').replaceChildren(...text.map((c, i) => {
    const span = document.createElement('span');
    if (shown(i)) { span.textContent = c; span.className = solved ? 'ok' : ''; return span; }
    const slot = k++;
    const space = /\s/.test(c), done = slot < typed.length, right = done && norm(typed[slot]) === norm(c);
    if (solved) { span.textContent = c; span.className = space ? '' : 'ok'; return span; }
    // Dấu cách cũng được chấm: gõ sai ở vị trí dấu cách thì hiện '*' đỏ.
    span.textContent = right || (space && !done) ? c : '*';
    span.className = right ? (space ? '' : 'ok') : done ? 'bad' : '';
    if (slot === typed.length) { span.classList.add('cur'); span.dataset.i = i; }  // vị trí cần gõ tiếp theo (giữ vị trí để đọc gợi ý)
    return span;
  }));
  $('answer').classList.toggle('done', solved);
}
$('answer').addEventListener('input', renderCaption);
// Gõ đúng cả câu (không còn dấu đỏ) rồi bấm phím cách: chuyển sang câu tiếp theo và phát âm thanh câu đó.
$('answer').addEventListener('keydown', e => {
  if (e.key !== ' ' || e.shiftKey || e.isComposing || !selected || completed || !$('answer').classList.contains('done')) return;
  e.preventDefault();
  const next = segments[segments.indexOf(selected) + 1];
  if (next) { selectSeg(next); playSeg(next); }
  else finishAll();
});
// Shift + Space: chỉ dùng để phát lại câu đang chọn từ đầu — trong ô đáp án không bao giờ gõ ra dấu cách.
let shiftSpacePending = false;   // vừa nhấn Shift+Space: chặn đúng một lần chèn dấu cách tiếp theo
document.addEventListener('keydown', e => {
  if (e.key !== ' ' || !e.shiftKey) { shiftSpacePending = false; return; }
  const inAnswer = e.target === $('answer');
  if (!inAnswer && $('quiz').hidden) return;          // ngoài chế độ luyện gõ: giữ hành vi bình thường
  e.preventDefault();
  shiftSpacePending = true;
  if (e.isComposing || !selected || completed) return;
  playing = null;                   // để playSeg phát lại từ đầu thay vì phát tiếp
  playSeg(selected);
}, true);
// Chặn thêm ở bước nhập: một số bộ gõ (vd. IME tiếng Nhật) vẫn chèn dấu cách dù keydown đã bị chặn.
$('answer').addEventListener('beforeinput', e => {
  if (shiftSpacePending && /^[\s　]+$/.test(e.data ?? '')) { e.preventDefault(); shiftSpacePending = false; }
});
// Shift + Enter: đọc to TỪ chứa ký tự đang cần gõ (chỗ có gạch chân) bằng giọng đọc của trình duyệt.
//  - Tiếng Anh: từ = cụm ký tự giữa hai dấu cách.
//  - Tiếng Nhật: tách từ bằng kuromoji (từ điển tiếng Nhật) và đọc theo cách đọc kana của từ đó,
//    để kanji được đọc đúng theo ngữ cảnh. Khi kuromoji chưa tải xong thì tạm dùng bộ tách từ của trình duyệt.
const CJK_RE = /[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/;
const KUROMOJI = 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/';
let tokenizerPromise = null;
function loadTokenizer() {
  return tokenizerPromise ??= new Promise((resolve, reject) => {
    const sc = Object.assign(document.createElement('script'), { src: KUROMOJI + 'build/kuromoji.js' });
    sc.onload = () => kuromoji.builder({ dicPath: KUROMOJI + 'dict/' }).build((err, t) => err ? reject(err) : resolve(t));
    sc.onerror = () => reject(new Error('Could not load kuromoji.'));
    document.head.append(sc);
  }).catch(e => { tokenizerPromise = null; throw e; });
}
let tokenizer = null;
const warmTokenizer = () => loadTokenizer().then(t => (tokenizer = t)).catch(() => {});

// Trả về [chữ cần đọc, ngôn ngữ] cho vị trí i (theo ký tự) trong câu.
function hintAt(text, i) {
  const chars = [...text];
  if (/\s/.test(chars[i])) return ['space', 'en-US'];
  if (CJK_RE.test(text)) {
    if (tokenizer) {
      let pos = 0;
      for (const tk of tokenizer.tokenize(text)) {
        const len = [...tk.surface_form].length;
        if (i < pos + len) return [tk.reading && tk.reading !== '*' ? tk.reading : tk.surface_form, 'ja-JP'];
        pos += len;
      }
    } else {
      warmTokenizer();
      const off = chars.slice(0, i).join('').length;      // vị trí theo UTF-16 cho Intl.Segmenter
      for (const sg of new Intl.Segmenter('ja', { granularity: 'word' }).segment(text))
        if (off < sg.index + sg.segment.length) return [sg.segment, 'ja-JP'];
    }
    return [chars[i], 'ja-JP'];
  }
  let a = i, b = i;
  while (a > 0 && !/\s/.test(chars[a - 1])) a--;
  while (b < chars.length - 1 && !/\s/.test(chars[b + 1])) b++;
  const word = chars.slice(a, b + 1).join('').replace(/^[\p{P}\p{S}]+|[\p{P}\p{S}]+$/gu, '');
  return [word || chars[i], 'en-US'];
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.shiftKey || e.isComposing || !selected || completed || $('quiz').hidden) return;
  e.preventDefault();
  const cur = $('caption').querySelector('.cur');
  if (!cur || !('speechSynthesis' in window)) return;
  const [say, lang] = hintAt(selected.text, +cur.dataset.i);
  const u = new SpeechSynthesisUtterance(say);
  u.lang = lang; u.rate = 0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
});
// Gõ xong câu cuối cùng: chúc mừng người gõ.
let completed = false;
function finishAll() {
  completed = true;
  $('answer').value = ''; $('answer').classList.remove('done');
  const p = Object.assign(document.createElement('span'), { className: 'congrats',
    textContent: `🎉 Well done! You completed all ${segments.length} sentence${segments.length > 1 ? 's' : ''}.` });
  $('caption').replaceChildren(p);
}
// Nút save: lưu script hiện tại vào thư viện trên server; icon đổi thành ✓ (hoặc ⚠) trong giây lát.
const SAVE_ICONS = {
  save: '<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7M7 3v4a1 1 0 0 0 1 1h7"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/>',
};
const setSaveIcon = n => { $('saveBtn').innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${SAVE_ICONS[n]}</svg>`; };
setSaveIcon('save');
$('saveBtn').onclick = async () => {
  if (!jobId) return;
  $('saveBtn').disabled = true;
  let ok = false;
  try { ok = (await fetch(`api/jobs/${jobId}/save`, { method: 'POST' })).ok; } catch {}
  setSaveIcon(ok ? 'check' : 'alert');
  if (ok) loadSaved();
  $('saveBtn').title = ok ? 'Saved' : 'Save failed — try again';
  setTimeout(() => { setSaveIcon('save'); $('saveBtn').title = 'Save to the library'; $('saveBtn').disabled = false; }, 1500);
};
// Mở một script: vào chế độ script, hiện sẵn câu đầu tiên để gõ và phát âm thanh câu đó.
function openScript(list, hasAudio) {
  segments = list; showScript(true);
  if (segments.some(sg => CJK_RE.test(sg.text))) warmTokenizer();   // tải sẵn từ điển tiếng Nhật
  selectSeg(segments[0]);
  if (hasAudio) playSeg(segments[0]);
}

// Danh sách bài đã lưu: bấm vào một bài để mở lại và luyện tiếp.
async function loadSaved() {
  let items = [];
  try { items = await (await fetch('api/library')).json(); } catch {}
  $('saved').replaceChildren(...items.map(savedRow));
  $('saved').hidden = !items.length;
}
function savedRow(it) {
  const li = document.createElement('li');
  const open = document.createElement('button');
  open.type = 'button'; open.className = 'open'; open.title = it.name;
  open.append(Object.assign(document.createElement('span'), { className: 'nm', textContent: it.name }),
              Object.assign(document.createElement('small'), { textContent: `${it.count} lines` }));
  open.onclick = () => openSaved(it.id);

  // Nút ba chấm dọc mở menu Edit / Delete.
  const more = document.createElement('button');
  more.type = 'button'; more.className = 'more'; more.title = 'More'; more.setAttribute('aria-label', `More actions for ${it.name}`);
  more.setAttribute('aria-haspopup', 'menu'); more.setAttribute('aria-expanded', 'false');
  more.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
  const menu = document.createElement('ul');
  menu.className = 'menu'; menu.hidden = true; menu.setAttribute('role', 'menu');
  const item = (label, fn) => {
    const mi = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.setAttribute('role', 'menuitem');
    b.onclick = () => { closeMenus(); fn(); };
    mi.append(b); return mi;
  };
  menu.append(item('Edit', () => startRename(li, open, it)), item('Delete', () => deleteSaved(it)));
  more.onclick = e => {
    e.stopPropagation();
    const show = menu.hidden;
    closeMenus();
    menu.hidden = !show; more.setAttribute('aria-expanded', show);
  };
  li.append(open, more, menu);
  return li;
}
function closeMenus() {
  $('saved').querySelectorAll('.menu').forEach(m => m.hidden = true);
  $('saved').querySelectorAll('.more').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
document.addEventListener('click', e => { if (!e.target.closest('#saved .menu')) closeMenus(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

// Edit: đổi tên ngay trên dòng. Enter hoặc bấm ra ngoài để lưu, Esc để hủy.
function startRename(li, open, it) {
  const input = Object.assign(document.createElement('input'), { className: 'rename', value: it.name });
  input.setAttribute('aria-label', 'New name');
  open.replaceWith(input); input.focus(); input.select();
  let done = false;
  const finish = async save => {
    if (done) return; done = true;
    const name = input.value.trim();
    if (save && name && name !== it.name) {
      try {
        const r = await fetch(`api/library/${it.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        if (!r.ok) msg((await r.json()).error || 'Could not rename.', true);
      } catch { msg('Could not rename.', true); }
    }
    loadSaved();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.stopPropagation(); finish(false); }
  };
  input.onblur = () => finish(true);
}
// Delete: xóa luôn bài đã lưu (không hỏi lại).
async function deleteSaved(it) {
  try { await fetch(`api/library/${it.id}`, { method: 'DELETE' }); } catch { msg('Could not delete.', true); }
  loadSaved();
}
async function openSaved(id) {
  if (busy) return;
  try {
    const r = await fetch(`api/library/${id}/load`, { method: 'POST' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Could not open.');
    jobId = j.id;
    const job = await (await fetch(`api/jobs/${jobId}`)).json();
    if (!job.segments?.length) throw new Error('This script has no sentences.');
    openScript(job.segments, job.has_audio);
  } catch (e) { msg(e.message, true); }
}
loadSaved();

// Icon bàn phím: bật/tắt hiện ô gõ đáp án.
$('inputBtn').onclick = () => {
  const on = !$('quiz').classList.contains('show-input');
  $('quiz').classList.toggle('show-input', on);
  $('inputBtn').setAttribute('aria-pressed', on);
  if (!$('quiz').hidden) $('answer').focus();
};
// Ô gõ bị ẩn nên luôn giữ focus cho nó: bấm vào câu hoặc gõ phím bất kỳ đều đưa phím vào ô.
$('caption').addEventListener('click', () => $('answer').focus());
document.addEventListener('keydown', e => {
  if (!$('quiz').hidden && document.activeElement !== $('answer') && !e.ctrlKey && !e.metaKey && !e.altKey
      && e.key.length === 1 && !e.target.closest('button, input')) $('answer').focus();
});
function selectSeg(seg) {
  selected = seg; completed = false;
  $('quiz').hidden = !seg;
  $('answer').value = ''; $('answer').classList.remove('done');
  renderCaption();
  if (seg) $('answer').focus();
  [...$('lines').children].forEach((li, i) => {
    const b = li.querySelector('.sel'), on = segments[i] === seg;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
}
function toggleList(on) {
  if (on) {
    $('lines').replaceChildren(...segments.map(seg => {
      const li = document.createElement('li');
      li.title = seg.text;            // câu bị cắt 1 dòng: rê chuột để xem đủ
      li.append(playButton(seg), Object.assign(document.createElement('span'), { textContent: seg.text }), selectButton(seg));
      return li;
    }));
    markPlaying();
  }
  $('lines').hidden = !on;
  $('listBtn').setAttribute('aria-expanded', on);
}
$('listBtn').onclick = () => toggleList($('lines').hidden);

// Phát âm thanh của một câu: tua tới start, dừng ở end.
let playing = null, stopRaf = 0;
const PCIRC = 75.4;
// Cập nhật nút của mọi câu: câu đang phát hiện pause + vòng thời gian; câu khác về play.
function markPlaying() {
  const a = $('player'), on = playing && !a.paused;
  [...$('lines').children].forEach((li, i) => {
    const seg = segments[i], cur = seg === playing, b = li.querySelector('.play');
    li.classList.toggle('playing', cur);
    b.classList.toggle('on', cur && on);
    b.setAttribute('aria-label', cur && on ? 'Pause' : 'Play');
    const p = cur ? Math.min(Math.max((a.currentTime - seg.start) / Math.max(seg.end - seg.start, .01), 0), 1) : 0;
    b.querySelector('.arc').style.strokeDashoffset = PCIRC * (1 - p);
  });
}
function tick() {
  const a = $('player');
  if (playing && a.currentTime >= playing.end) { a.pause(); playing = null; markPlaying(); return; }
  markPlaying();
  if (!a.paused) stopRaf = requestAnimationFrame(tick);
}
// Phát một câu; bấm lại đúng câu vừa pause thì phát tiếp từ chỗ dừng.
function playSeg(seg) {
  const a = $('player');
  const src = `api/jobs/${jobId}/audio`;
  if (!a.src.endsWith(src)) a.src = src;
  cancelAnimationFrame(stopRaf);
  const resume = seg === playing && a.currentTime > seg.start && a.currentTime < seg.end;
  playing = seg;
  if (!resume) a.currentTime = seg.start;
  a.play().then(() => { stopRaf = requestAnimationFrame(tick); })
          .catch(() => markPlaying());   // trình duyệt có thể chặn tự phát nếu chưa tương tác với trang
  markPlaying();
}
function pauseSeg() {
  cancelAnimationFrame(stopRaf); $('player').pause(); markPlaying();
}
function stopAudio() {
  cancelAnimationFrame(stopRaf); playing = null;
  const a = $('player'); a.pause(); a.removeAttribute('src'); a.load();
}
// Bấm ra ngoài hoặc nhấn Esc thì đóng danh sách.
document.addEventListener('click', e => { if (!$('nav').contains(e.target)) toggleList(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleList(false); });
// back: xóa script hiện tại và đưa giao diện về trạng thái ban đầu để tạo cái mới.
$('back').onclick = () => {
  showScript(false);
  stopAudio(); selectSeg(null); jobId = null; segments = []; setFile(null); $('url').value = ''; msg('');
  $('tstart').value = '0:00'; $('tend').value = '0:30'; syncRange();
  $('start').disabled = !canStart(); $('url').focus();
};

function poll() {
  timer = setInterval(async () => {
    try {
      const j = await (await fetch(`api/jobs/${jobId}`)).json();
      msg(j.message, j.status === 'error');
      setProgress(j.progress || 0);
      if (j.status === 'done' || j.status === 'error') {
        clearInterval(timer); setBusy(false);
        if (j.status === 'done' && j.segments?.length) {
          openScript(j.segments, j.has_audio);
        }
      }
    } catch { clearInterval(timer); msg('Lost connection to the server.', true); setBusy(false); }
  }, 800);
}
</script>
